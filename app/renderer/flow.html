<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>JM Desk · 协同录入</title>
<link rel="stylesheet" href="./theme.css">
<style>
/* 协同录入（1.10.0）：左边是全流程的九步和各自的状态，右边是当前这一步——平台现状、AI 的建议和依据、人的选择与确认。
 * 间距 4 / 8 / 12 / 16 / 24；字号 11 / 12 / 13 / 14 / 16。颜色全部来自 tokens.css。 */
html,body{margin:0;height:100%;font:var(--font);color:var(--ink);overflow:hidden;background:var(--page)}
#top{height:54px;display:flex;align-items:center;gap:10px;padding:0 16px 0 86px;-webkit-app-region:drag;border-bottom:1px solid var(--line);background:rgba(255,255,255,.6)}
body.win #top{padding-left:16px}
#top h1{margin:0;font-size:16px;font-weight:700;white-space:nowrap}
#top .code{flex:none}#what{color:var(--sub);font-size:13px;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;flex:1}
#top button{-webkit-app-region:no-drag;white-space:nowrap}
#main{position:absolute;top:55px;bottom:0;left:0;right:0;display:flex}
#steps{width:270px;flex:none;overflow:auto;padding:12px 8px;border-right:1px solid var(--line);background:rgba(255,255,255,.45)}
.st{display:flex;gap:10px;padding:8px 10px;border-radius:10px;cursor:pointer;position:relative}
.st:hover{background:rgba(255,255,255,.85)}.st.on{background:#fff;box-shadow:0 0 0 1.5px var(--pink)}
.st .d{flex:none;width:18px;height:18px;border-radius:50%;margin-top:1px;box-sizing:border-box;border:2px solid var(--line);background:#fff;display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff}
.st.done .d{background:var(--green);border-color:var(--green)}.st.now .d{border-color:var(--pink);box-shadow:0 0 0 3px color-mix(in srgb,var(--pink) 18%,transparent)}.st.warn .d{background:var(--orange);border-color:var(--orange)}
.st b{display:block;font-size:13px;font-weight:650}.st small{display:block;font-size:11px;color:var(--sub);margin-top:2px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.st.todo b{color:var(--faint)}.st.warn small{color:var(--orange)}
#pane{flex:1;min-width:0;overflow:auto;padding:16px 24px 32px}
.wrap{max-width:760px;display:flex;flex-direction:column;gap:12px}
.box{background:var(--card,#fff);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.box h4{margin:0 0 10px;font-size:14px;font-weight:650;display:flex;align-items:center;gap:8px}.box h4 em{font-style:normal;font-size:11px;color:var(--sub);font-weight:500}
.box.ai{border-color:color-mix(in srgb,var(--violet) 35%,var(--line));background:color-mix(in srgb,var(--violet) 4%,#fff)}
.box.warn{border-color:color-mix(in srgb,var(--orange) 45%,var(--line));background:var(--warn-bg)}
.note{font-size:12px;color:var(--sub);line-height:1.6}.note b{color:var(--ink)}
.facts{display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;font-size:13px}.facts label{color:var(--sub);font-size:12px;padding-top:1px}
.f{display:grid;grid-template-columns:96px 1fr;gap:10px 12px;align-items:start}.f>label{font-size:12px;color:var(--sub);padding-top:8px}.f>label i{color:var(--red);font-style:normal;margin-left:2px}
.f input,.f textarea,.f select{width:100%;box-sizing:border-box}.f textarea{min-height:64px;resize:vertical}
.two{display:flex;gap:8px;align-items:center}.two>*{flex:1;min-width:0}.two span{flex:none;color:var(--sub);font-size:12px}.two button{flex:none}
.ev{font-size:11px;line-height:1.5;margin-top:4px;color:var(--sub)}.ev.good::before{content:"✓ ";color:var(--green)}.ev.weak::before{content:"? ";color:var(--orange)}.ev.none{color:var(--orange)}
.ev q{quotes:"「" "」";color:var(--ink)}.ev.link{cursor:pointer}.ev.link:hover{text-decoration:underline}
.opt{display:flex;align-items:flex-start;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:#fff;margin-top:6px}
.opt:hover{border-color:color-mix(in srgb,var(--pink) 45%,var(--line))}.opt.on{border-color:var(--pink);box-shadow:0 0 0 1px var(--pink)}.opt.dis{opacity:.5;cursor:not-allowed}
.opt input{margin-top:2px;flex:none}.opt b{font-size:13px;font-weight:600}.opt small{display:block;font-size:11px;color:var(--sub);margin-top:2px}.opt .grow{flex:1;min-width:0}
.opt .tag{flex:none}
.act{display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap}.act .grow{flex:1}
.sure{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--info-bg);font-size:12px;line-height:1.6}.sure b{display:block;margin-bottom:4px;font-size:13px}.sure ul{margin:4px 0 0;padding-left:18px}
.miss{font-size:12px;color:var(--orange);margin-top:6px}
.list .r{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line);font-size:13px}.list .r:first-child{border-top:0}.list .r .ti{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.list .r .x{color:var(--sub);font-size:12px;white-space:nowrap}
.empty{color:var(--sub);text-align:center;padding:48px 0;font-size:13px}
.loading{display:flex;gap:6px;justify-content:center;padding:48px 0}.loading i{width:7px;height:7px;border-radius:50%;background:var(--pink);animation:b 1s infinite ease-in-out}.loading i:nth-child(2){animation-delay:.15s}.loading i:nth-child(3){animation-delay:.3s}@keyframes b{0%,80%,100%{opacity:.25;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
button.sm{font-size:12px;padding:3px 10px}
.flash{padding:8px 12px;border-radius:10px;font-size:13px}.flash.good{background:var(--ok-bg)}.flash.bad{background:var(--bad-bg)}
</style></head>
<body>
<div id="top"><h1>协同录入</h1><span id="code" class="code"></span><span id="what"></span><button id="reload" title="重新读平台上的现状">刷新</button><button id="web" class="ghost" title="在需求管理平台的网页上看这条需求">在平台上查看</button></div>
<div id="main"><div id="steps"></div><div id="pane"><div class="loading"><i></i><i></i><i></i></div></div></div>
<script src="./ui.js"></script><script src="./flow.js"></script></body></html>
