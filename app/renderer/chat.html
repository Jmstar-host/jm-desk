<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>JM Desk · 助手</title>
<link rel="stylesheet" href="./theme.css">
<style>
html,body{margin:0;height:100%;font:var(--font);color:var(--ink);overflow:hidden;
  background:var(--page)}
.page-sky{position:fixed;inset:0;z-index:0}
#top{position:relative;z-index:1;height:54px;display:flex;align-items:center;gap:10px;padding:0 18px 0 86px;-webkit-app-region:drag;border-bottom:1px solid var(--line);background:rgba(255,255,255,.35);backdrop-filter:blur(8px)}
body.win #top{padding-left:18px}
#top .orb{width:24px;height:24px}
#top h1{margin:0;font-size:16px;white-space:nowrap;color:var(--ink);font-weight:700}
#top .sp{flex:1}
#top button{-webkit-app-region:no-drag;white-space:nowrap}
#sum{color:var(--sub);font-size:12px;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#main{position:absolute;z-index:1;top:55px;bottom:0;left:0;right:0;display:flex}

/* 左：会话列表 */
#side{width:264px;flex:none;display:flex;flex-direction:column;border-right:1px solid var(--line);background:rgba(255,255,255,.32)}
#side .hd{padding:12px 14px 6px;font-size:12px;font-weight:650;color:var(--sub)}
#threads{flex:1;overflow:auto;padding:2px 10px 16px}
.th{position:relative;padding:9px 12px;border-radius:14px;margin:3px 0;cursor:pointer;transition:background .15s,box-shadow .15s}
.th:hover{background:rgba(255,255,255,.7)}
.th.on{background:#fff;box-shadow:inset 0 0 0 1.5px var(--a1),0 3px 12px var(--glow)}
.th .t{font-weight:650;line-height:1.4;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.th:hover .t,.th.on .t{padding-right:84px}
.th .m{font-size:11.5px;color:var(--sub);margin-top:2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.th .ops{position:absolute;right:8px;top:8px;display:none;gap:2px}
.th:hover .ops,.th.on .ops{display:flex}
.th .ops button{padding:2px 6px;font-size:11px;box-shadow:none;background:transparent;color:var(--sub)}
.th .ops button:hover{color:var(--ink);background:color-mix(in srgb,var(--a2) 14%,transparent);transform:none}
.th .run{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px;vertical-align:middle;background:var(--brand);animation:pulse 1s ease-in-out infinite}

/* 右：对话 */
#conv{flex:1;min-width:0;display:flex;flex-direction:column}
#head{padding:12px 26px 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
#head .ti{display:flex;align-items:center;gap:8px;min-width:0}
#head h2{margin:0;font-size:15px;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.hrow{display:flex;align-items:center;gap:8px;min-width:0;font-size:12px}
.hrow .lb,.dlg .f label{flex:none;font-size:12px;color:var(--sub)}
.hrow select{font-size:12px;padding:4px 28px 4px 10px;border-radius:999px;max-width:320px}
.hrow .path{color:var(--sub);min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;direction:rtl;text-align:left}
.hrow .sp{flex:1}
.hrow button{flex:none;padding:3px 11px}
.dlg .f{display:grid;grid-template-columns:64px 1fr;gap:9px 10px;align-items:center;margin:12px 0 4px}
.dlg .f input,.dlg .f select{width:100%}
.dlg .f .pick{display:flex;gap:6px;min-width:0}.dlg .f .pick span{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:12px;color:var(--sub);align-self:center}
.dlg .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
#scope{display:flex;align-items:center;gap:8px;min-width:0}
#scope .lb{flex:none;font-size:12px;color:var(--sub)}
#scope .chips{flex-wrap:nowrap;overflow-x:auto;padding:2px 0;scrollbar-width:none}
#scope .chips::-webkit-scrollbar{display:none}
#scope .chips b{flex:none;white-space:nowrap}
#log{flex:1;overflow:auto;padding:18px 26px 8px}
.col{max-width:820px;margin:0 auto}
.turn{margin-bottom:20px}
.u{display:flex;justify-content:flex-end;margin-bottom:10px}
.u .bb{max-width:78%;padding:8px 13px;border-radius:14px 4px 14px 14px;line-height:1.6;white-space:pre-wrap;word-break:break-word;color:#fff;background:var(--brand);box-shadow:0 3px 10px var(--glow)}
.a{display:flex;gap:10px;align-items:flex-start}
.a .orb{width:26px;height:26px;margin-top:2px;animation:none}
.a .body{flex:1;min-width:0}
.tag.ok,.tag.warn{margin-top:0}
.steps{margin:0 0 8px}
.step{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px;padding:4px 0;font-size:12px}
.step .nm{font:11.5px ui-monospace,Menlo,Consolas,monospace;color:var(--ink);min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;max-width:46%}
.step .why{color:var(--sub);min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;flex:1}
.step details{flex-basis:100%}
.step summary{cursor:pointer;color:var(--sub);font-size:11.5px;list-style:none;display:inline-block}
.step summary::-webkit-details-marker{display:none}
.step summary:hover{color:var(--ink)}
.step pre.args{margin:4px 0 2px}
.ans{background:#fff;border-radius:4px 14px 14px 14px;padding:10px 14px;line-height:1.7;word-break:break-word;box-shadow:inset 0 0 0 1px rgba(255,255,255,.95),0 1px 2px color-mix(in srgb,var(--black) 5%,transparent),0 3px 10px color-mix(in srgb,var(--black) 5%,transparent)}
.ans p{margin:0 0 6px}.ans p:last-child{margin-bottom:0}
.ans h4{margin:8px 0 4px;font-size:13.5px}.ans h4:first-child{margin-top:0}
.ans ul,.ans ol{margin:2px 0 6px;padding-left:20px}.ans li{margin:1px 0}
.ans pre{white-space:pre-wrap;word-break:break-all;font:11.5px/1.55 ui-monospace,Menlo,Consolas,monospace;background:color-mix(in srgb,var(--a2) 8%,white);border-radius:10px;padding:8px 10px;margin:6px 0;overflow:auto}
.ans a{color:var(--a1);text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--a1) 40%,transparent)}
.ans.bad{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--orange) 32%,transparent);color:var(--warn-fg)}
.meta{font-size:11.5px;color:var(--sub);margin-top:5px;display:flex;gap:8px;flex-wrap:wrap}
.confirm{margin:6px 0 10px;padding:10px 12px;border-radius:14px;background:#fff;box-shadow:inset 0 0 0 1.5px var(--a1),0 3px 12px var(--glow)}
.confirm b{font-weight:650}.confirm .row{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
.a .loading{justify-content:flex-start;padding:8px 2px}

/* 空状态 */
#hello{max-width:560px;margin:8vh auto 0;text-align:center}
#hello .orb{width:54px;height:54px;margin:0 auto 14px}
#hello h3{margin:0 0 6px;font-size:17px}
#hello .muted{margin-bottom:16px}
#hello .eg{display:flex;flex-direction:column;gap:8px;align-items:stretch}
#hello .eg button{border-radius:14px;padding:9px 14px;text-align:left;font-size:13px}
#hello .need{margin:0 0 14px;padding:10px 12px;border-radius:14px;background:var(--warn-bg);color:var(--warn-fg);font-size:12.5px;line-height:1.6;display:flex;align-items:center;gap:10px;text-align:left}
#hello .need span{flex:1}

/* 输入 */
#composer{padding:8px 26px 16px}
#box{display:flex;align-items:flex-end;gap:8px;background:#fff;border-radius:18px;padding:8px 8px 8px 14px;box-shadow:inset 0 0 0 1px var(--line),0 4px 16px color-mix(in srgb,var(--black) 7%,transparent);transition:box-shadow .2s}
#box:focus-within{box-shadow:inset 0 0 0 1.5px var(--a1),0 0 0 3px var(--glow)}
#q{flex:1;min-height:24px;max-height:168px;height:24px;resize:none;overflow-y:hidden;padding:3px 0;background:transparent;box-shadow:none;border-radius:0;line-height:1.6}
#q:focus{box-shadow:none}
#go{flex:none;height:30px;min-width:64px}
#tip{font-size:11.5px;color:var(--sub);margin:6px 4px 0;display:flex;gap:10px}
#tip .sp{flex:1}
/* 会议纪要（meeting-ui.js）：盖在对话区上面 */
#conv{position:relative}
#meet{position:absolute;inset:0;z-index:5;overflow:auto;padding:16px 24px 32px;background:var(--page)}
#meet.hide{display:none}
#meet .mtop{display:flex;margin-bottom:8px}
#meet .mcard{max-width:520px;margin:24px auto;padding:22px 24px;border-radius:18px;background:var(--white);box-shadow:0 0 0 1px var(--line),0 6px 24px color-mix(in srgb,var(--black) 6%,transparent);text-align:left}
#meet .mcard.wide{max-width:760px}
#meet .mcard h3{margin:4px 0 6px;font-size:18px}
#meet .mcard input{width:100%;margin:14px 0 4px;padding:9px 12px;border-radius:12px}
#meet .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}#meet .row.c{justify-content:center}
#meet button.big{padding:9px 22px;font-size:13px;display:inline-flex;align-items:center;gap:8px}
#meet .mic{display:flex;justify-content:center;margin-bottom:4px}#meet .mic .orb{width:56px;height:56px}
#meet .mcard:not(.wide){text-align:center}#meet .mcard:not(.wide) input{text-align:center}
.rec{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--red);flex:none}
.rec.live{animation:recp 1.2s ease-in-out infinite}@keyframes recp{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--red) 18%,transparent)}}
#meetbtn{display:inline-flex;align-items:center;gap:6px}#meetbtn .rec{background:color-mix(in srgb,var(--black) 30%,transparent)}
#meetbtn.on{color:var(--red);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--red) 50%,transparent)}#meetbtn.on .rec{background:var(--red);animation:recp 1.2s ease-in-out infinite}
#meet .rechd{display:flex;align-items:center;gap:10px;margin-bottom:12px}#meet .rechd .clock{font-size:20px;font-variant-numeric:tabular-nums}
#meet .caps{height:min(52vh,440px);overflow:auto;padding:12px 14px;border-radius:12px;background:color-mix(in srgb,var(--black) 3%,white);line-height:1.8;font-size:13.5px}
#meet .caps p{margin:0 0 4px;color:var(--ink)}#meet .caps p.draft{color:var(--sub);font-style:italic}#meet .caps p.draft:empty{display:none}
#meet .miss{text-align:left;margin:10px auto;padding-left:20px;line-height:1.8;font-size:12.5px;display:inline-block}
#meet .cmd{display:flex;gap:8px;align-items:center;justify-content:center;margin:8px 0;flex-wrap:wrap}#meet .cmd code{font-size:12.5px;padding:5px 10px}
#meet .bar{position:relative;width:100%;height:28px;border-radius:14px;background:color-mix(in srgb,var(--black) 6%,transparent);overflow:hidden}
#meet .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--brand);border-radius:14px;transition:width .4s}
#meet .bar span{position:relative;line-height:28px;font-size:12px;color:var(--ink)}
#meet .steps2{text-align:left;display:inline-block;margin:12px auto;padding-left:20px;line-height:2;color:var(--faint)}
#meet .steps2 li.ok{color:var(--ok-fg)}#meet .steps2 li.now{color:var(--ink);font-weight:650}
#meet .sum{font-size:13.5px;line-height:1.8;margin:0 0 12px}
#meet section h4{margin:16px 0 6px;font-size:13px}#meet section ul{margin:0;padding-left:20px;line-height:1.8;font-size:13px}
#meet section em{font-style:normal;font-size:11px;margin-left:6px;padding:0 6px;border-radius:8px;background:color-mix(in srgb,var(--black) 6%,transparent);color:var(--sub)}
#meet section q{display:block;font-size:12px;color:var(--sub);quotes:'「' '」'}
#meet details{margin-top:14px}#meet details summary{cursor:pointer;font-size:12.5px;color:var(--blue-d)}#meet details pre{max-height:320px}
button.sm{font-size:12px;padding:3px 10px}
button.pri .rec{background:var(--white)}
</style></head>
<body>
<div class="sky page-sky"><b style="left:46%;top:3%"></b><b style="left:93%;top:12%;animation-delay:1.6s"></b><b style="left:3%;top:88%;animation-delay:2.8s"></b><b style="left:70%;top:95%;animation-delay:.8s;width:6px;height:6px"></b></div>
<div id="top"><div class="orb"></div><h1>助手</h1><span id="sum"></span><span class="sp"></span>
  <button id="integ" title="添加或管理平台 API、MCP">接入</button><button id="models" title="模型来源与顺序">模型</button><button class="pri" id="new">新对话</button></div>
<div id="main">
  <div id="side"><div class="hd">对话</div><div id="threads"></div></div>
  <div id="conv">
    <div id="head"><div class="ti"><h2 id="title">新对话</h2></div><div class="hrow" id="target"></div><div id="scope"><span class="lb">可用工具</span><div class="chips" id="chips"></div></div></div>
    <div id="log"><div class="col" id="turns"></div></div>
    <div id="composer"><div class="col"><div id="box"><textarea id="q" rows="1" placeholder="要办什么？直接说，可以接着上一句往下问"></textarea><button class="pri" id="go">发送</button></div>
      <div id="tip"><span>Enter 发送 · Shift + Enter 换行</span><span class="sp"></span><span id="note">改数据前会先问你</span></div></div></div>
  </div>
</div>
<script src="./ui.js"></script><script src="./chat.js"></script><script src="./meeting-ui.js"></script></body></html>
