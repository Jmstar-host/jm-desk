<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>JM Desk 精灵</title>
<link rel="stylesheet" href="./tokens.css">
<style>
html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden;font:12.5px -apple-system,"PingFang SC",sans-serif;user-select:none}
/* 精灵窗口只有舞台本身（220×220）：只移动、不改大小。边缘的星光沿圆形渐隐，不会被方框切断 */
#stage{position:absolute;left:0;top:0;width:220px;height:220px;cursor:grab;touch-action:none}
body.dragging #stage{cursor:grabbing}
#stage canvas{display:block;width:100%!important;height:100%!important;
  -webkit-mask-image:radial-gradient(circle closest-side at 50% 50%,#000 74%,rgba(0,0,0,.6) 88%,transparent 100%)}
#badge{position:absolute;min-width:20px;height:20px;padding:0 6px;box-sizing:border-box;border-radius:999px;background:var(--pink);color:var(--white);
  font-weight:700;font-size:11.5px;line-height:17px;text-align:center;box-shadow:0 2px 6px var(--glow);border:1.5px solid var(--white);white-space:nowrap;display:none;pointer-events:none;z-index:2}
/* 未读气泡（1.8.3）：每个来源一个，贴着泡泡左上沿排开，轻轻浮动；点一下去看 */
.chip{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;z-index:2;cursor:pointer;display:grid;place-items:center;color:var(--c,var(--pink));
  background:radial-gradient(circle at 35% 28%,var(--white) 0 30%,color-mix(in srgb,var(--c,var(--pink)) 14%,var(--white)) 100%);box-shadow:var(--rim),0 2px 8px color-mix(in srgb,var(--c,var(--pink)) 35%,transparent);
  animation:chipfloat 3.2s ease-in-out infinite;animation-delay:var(--d,0s);transition:transform .15s}
.chip:hover{transform:scale(1.12)}
.chip svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.chip b{position:absolute;top:-5px;right:-7px;min-width:15px;height:15px;padding:0 4px;box-sizing:border-box;border-radius:8px;background:var(--c,var(--pink));color:var(--white);font-size:9.5px;font-weight:700;line-height:15px;text-align:center;border:1px solid var(--white)}
@keyframes chipfloat{0%,100%{translate:0 0}50%{translate:0 -3px}}
body.dragging .chip{pointer-events:none}
@media (prefers-reduced-motion:reduce){.chip{animation:none}}
/* 串门搬回来的星光包裹 */
#parcel{position:absolute;left:93px;top:168px;width:34px;height:34px;border-radius:50%;opacity:0;transform:scale(.2);transition:opacity .3s,transform .45s cubic-bezier(.2,1.6,.4,1);pointer-events:none;z-index:3;
  background:radial-gradient(circle at 38% 32%,var(--white) 0 18%,var(--pink-l) 32%,var(--pink) 72%,var(--blue));box-shadow:0 0 18px 4px var(--glow),0 0 32px color-mix(in srgb,var(--blue) 30%,transparent)}
#parcel::after{content:'✦';position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:15px;text-shadow:0 0 6px #fff}
#parcel.on{opacity:1;transform:scale(1);animation:sway 1.2s ease-in-out infinite}
@keyframes sway{0%,100%{translate:0 0}50%{translate:0 4px}}
</style></head>
<body>
<div id="stage"></div>
<div id="badge"></div>
<div id="chips"></div>
<div id="parcel"></div>
<script type="module" src="./sprite.js"></script>
</body></html>
