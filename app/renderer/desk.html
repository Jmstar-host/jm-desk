<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>JM Desk</title>
<link rel="stylesheet" href="./theme.css">
<style>
/* 主窗口左边的一列：切换助手 / 工作台 / 线索 / 聊天（Star）；底下是搬运和设置（在精灵旁边的小窗里打开）。右边的页面由主进程放在这一列旁边。 */
html,body{margin:0;height:100%;font:var(--font);color:var(--ink);overflow:hidden;user-select:none;
  background:linear-gradient(180deg,var(--white),color-mix(in srgb,var(--black) 3%,white))}
#rail{position:fixed;left:0;top:0;bottom:0;width:76px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:56px 0 14px;box-sizing:border-box;
  border-right:1px solid var(--line);-webkit-app-region:drag}
body.win #rail{padding-top:14px}
.it{position:relative;width:60px;padding:8px 0 6px;border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;color:var(--sub);
  font-size:11.5px;-webkit-app-region:no-drag;transition:background .15s,color .15s}
.it svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.it:hover{background:rgba(255,255,255,.6);color:var(--ink)}
.it.on{background:#fff;color:var(--ink);font-weight:650;box-shadow:var(--rim),0 3px 12px var(--glow)}
.it.on svg{stroke:var(--a1)}
.it .n{position:absolute;top:3px;right:6px;min-width:16px;height:16px;padding:0 4px;box-sizing:border-box;border-radius:8px;font-size:10px;line-height:16px;text-align:center;color:#fff;font-weight:650;
  background:var(--brand)}
.sp{flex:1}
.sep{width:36px;height:1px;background:var(--line);margin:6px 0}
</style></head>
<body>
<nav id="rail"></nav>
<script>
const { ipcRenderer } = require('electron');
const qs = new URLSearchParams(location.search);
for (const k of ['a1', 'a2']) if (/^#[0-9a-f]{6}$/i.test(qs.get(k) || '')) document.documentElement.style.setProperty('--' + k, qs.get(k));
if (process.platform !== 'darwin') document.body.classList.add('win');
const ICON = {
  chat: '<path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v7a2.5 2.5 0 0 1-2.5 2.5H10l-4 3.5V16h0.5"/><path d="M8.5 9.5h7M8.5 12.5h4.5"/>',
  work: '<rect x="4" y="4" width="16" height="16" rx="2.5"/><path d="M8 9h8M8 12.5h8M8 16h5"/>',
  list: '<path d="M4 7l8 5 8-5"/><rect x="4" y="5" width="16" height="14" rx="2.5"/>',
  star: '<path d="M12 3.8l2.3 4.8 5.2.7-3.8 3.6.9 5.2L12 15.6l-4.6 2.5.9-5.2-3.8-3.6 5.2-.7z"/>',
  peers: '<circle cx="8" cy="9" r="3"/><circle cx="16.5" cy="10" r="2.5"/><path d="M3.5 19c.6-3 2.4-4.5 4.5-4.5s3.9 1.5 4.5 4.5M13.5 18.5c.5-2.2 1.7-3.3 3-3.3 1.4 0 2.6 1.1 3 3.3"/>',
  settings: '<circle cx="12" cy="12" r="3"/><path d="M12 3.5v2.2M12 18.3v2.2M3.5 12h2.2M18.3 12h2.2M6 6l1.6 1.6M16.4 16.4 18 18M6 18l1.6-1.6M16.4 7.6 18 6"/>',
};
const TABS = [['chat', '助手'], ['work', '工作台'], ['list', '线索'], ['star', '聊天']];
const PANELS = [['peers', '搬运', 'app.peers'], ['settings', '设置', 'app.settings']];
let cur = null, counts = {};
function draw() {
  const it = (icon, label, on, onclick, n) => {
    const e = document.createElement('div'); e.className = 'it' + (on ? ' on' : ''); e.title = label; e.onclick = onclick;
    e.innerHTML = `<svg viewBox="0 0 24 24">${ICON[icon]}</svg><span></span>` + (n ? `<b class="n">${n > 99 ? '99+' : n}</b>` : '');
    e.querySelector('span').textContent = label; return e;
  };
  const sep = () => Object.assign(document.createElement('div'), { className: 'sp' });
  document.getElementById('rail').replaceChildren(
    ...TABS.map(([id, label]) => it(id, label, id === cur, () => { if (id !== cur) { cur = id; draw(); ipcRenderer.send('desk:go', id); } }, counts[id])),
    sep(), ...PANELS.map(([icon, label, action]) => it(icon, label, false, () => ipcRenderer.send('desk:panel', action))));
}
ipcRenderer.on('desk:tab', (_e, t) => { cur = t; draw(); });
ipcRenderer.on('desk:counts', (_e, c) => { counts = { ...counts, ...(c || {}) }; draw(); }); // 工作台和聊天（Star 未读）分别推过来，合并
ipcRenderer.invoke('desk:state').then(s => { cur = cur || s.tab; draw(); });
draw();
</script></body></html>
