<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>JM Desk · 线索</title>
<link rel="stylesheet" href="./theme.css">
<style>
html,body{margin:0;height:100%;font:var(--font);color:var(--ink);overflow:hidden;
  background:radial-gradient(70% 50% at 0% 0%,color-mix(in srgb,var(--a1) 13%,transparent),transparent 60%),radial-gradient(60% 50% at 100% 100%,color-mix(in srgb,var(--a2) 15%,transparent),transparent 60%),linear-gradient(170deg,#fffbff,#f8f4ff)}
#top .orb{width:24px;height:24px}
.page-sky{position:fixed;inset:0;z-index:0}
#top{position:relative;z-index:1;background:rgba(255,255,255,.35);backdrop-filter:blur(8px)}#main{z-index:1}
#side{background:rgba(255,255,255,.32)}
.tag.queued{background:color-mix(in srgb,var(--a1) 14%,transparent)}.tag.submitted{background:rgba(21,128,61,.12);color:#166534}.tag.failed{background:rgba(234,88,12,.12);color:#9a3412}.tag.ignored{background:rgba(120,120,140,.12);color:#555}
#top{height:54px;display:flex;align-items:center;gap:10px;padding:0 18px 0 86px;-webkit-app-region:drag;border-bottom:1px solid var(--line)}
body.win #top{padding-left:18px}
#top h1{margin:0;font-size:16px;background:linear-gradient(90deg,var(--a1),var(--a2));-webkit-background-clip:text;color:transparent}
#top .sp{flex:1}
#top button,#top input{-webkit-app-region:no-drag}
#main{position:absolute;top:55px;bottom:0;left:0;right:0;display:flex}
#side{width:42%;min-width:320px;max-width:520px;display:flex;flex-direction:column;border-right:1px solid var(--line)}
#filters{padding:12px 14px 8px;display:flex;flex-direction:column;gap:8px}
#q{border:none;border-radius:12px;padding:8px 12px;font:inherit;background:#fff;box-shadow:inset 0 0 0 1px var(--line);outline:none}
#q:focus{box-shadow:inset 0 0 0 1.5px var(--a1),0 0 0 3px var(--glow)}
#items{flex:1;overflow:auto;padding:2px 10px 16px}
.it{padding:10px 12px;border-radius:14px;margin:4px 0;cursor:pointer;transition:background .15s,box-shadow .15s}
.it:hover{background:rgba(255,255,255,.7)}
.it.on{background:#fff;box-shadow:inset 0 0 0 1.5px var(--a1),0 3px 12px var(--glow)}
.it .t{display:flex;align-items:center;gap:6px;font-weight:650;line-height:1.4}
.it .t span{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.it .p{color:var(--ink);opacity:.82;font-size:12.5px;line-height:1.5;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.it .m{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px;font-size:11.5px;color:var(--sub)}
.it.ignored{opacity:.55}
#detail{flex:1;overflow:auto;padding:18px 26px 30px}
#detail h2{margin:0 0 4px;font-size:18px}
#detail .m{display:flex;gap:8px;flex-wrap:wrap;color:var(--sub);font-size:12px;margin-bottom:12px;align-items:center}
.act{display:flex;gap:8px;margin:0 0 14px}
.msg{display:flex;gap:10px;margin:10px 0}
.av{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:12px;font-weight:650;color:#fff;background:linear-gradient(135deg,var(--a1),var(--a2))}
.bb{max-width:78%;background:#fff;border-radius:4px 14px 14px 14px;padding:8px 12px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.95),0 2px 8px color-mix(in srgb,var(--a2) 10%,transparent);line-height:1.6;white-space:pre-wrap;word-break:break-word}
.bb small{display:block;color:var(--sub);font-size:11px;margin-bottom:2px}
.bb.ph{color:var(--sub);background:rgba(255,255,255,.6)}
.mail{background:#fff;border-radius:16px;padding:14px 18px;white-space:pre-wrap;line-height:1.7;box-shadow:inset 0 0 0 1px rgba(255,255,255,.95),0 3px 12px color-mix(in srgb,var(--a2) 10%,transparent)}
.tag.drv{background:color-mix(in srgb,var(--a1) 12%,white);color:color-mix(in srgb,var(--a1) 60%,var(--ink))}
.drvbox{margin:0 0 16px;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.7);box-shadow:var(--rim),0 2px 10px color-mix(in srgb,var(--a2) 10%,transparent)}
.drvbox.none{font-size:12px;color:var(--sub)}
.drvbox .dh{font-size:12px;font-weight:650;color:var(--sub);margin-bottom:6px}
.dw{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:10px;cursor:pointer}.dw:hover{background:#fff;box-shadow:0 2px 8px var(--glow)}
.dw small{color:var(--sub)}
.dlg.wide{max-width:560px}
.dlg .sr{display:flex;align-items:center;gap:8px;padding:5px 0}.dlg .sr span{flex:1}
.dlg .sec{margin:14px 0 6px;font-weight:650;font-size:13px}
.dlg .stats{display:flex;gap:8px}.dlg .stats div{flex:1;background:#fff;border-radius:12px;padding:8px;text-align:center;box-shadow:var(--rim)}.dlg .stats b{display:block;font-size:17px}.dlg .stats span{font-size:11.5px;color:var(--sub)}
.dlg .log{max-height:200px;overflow:auto;font-size:12px;line-height:1.7}.dlg .log .e{color:#c2410c}
.lv{flex:none;font-size:11px;font-weight:650;padding:1px 7px;border-radius:6px;color:#fff}
.lv.program{background:#7c3aed}.lv.project{background:#2563eb}.lv.requirement{background:#db2777}.lv.todo{background:#0d9488}
</style></head>
<body>
<div class="sky page-sky"><b style="left:46%;top:3%"></b><b style="left:93%;top:12%;animation-delay:1.6s"></b><b style="left:3%;top:88%;animation-delay:2.8s"></b><b style="left:70%;top:95%;animation-delay:.8s;width:6px;height:6px"></b></div>
<div id="top"><div class="orb"></div><h1>线索</h1><span class="muted" id="sum" style="color:var(--sub);font-size:12px"></span><span class="sp"></span>
  <button id="srcs" title="收哪些信息源、搬运记录、需求管理平台上的候选需求">信息源与记录</button><button id="mp2" title="在需求管理平台里确认候选需求">在需求管理平台查看</button><button class="pri" id="run">立即搬运</button></div>
<div id="main">
  <div id="side"><div id="filters"><input id="q" placeholder="搜索标题、人名、内容…"><div class="chips" id="st"></div><div class="chips" id="src"></div></div><div id="items"></div></div>
  <div id="detail"><div class="empty">选一条线索看详情</div></div>
</div>
<script src="./ui.js"></script><script src="./list.js"></script></body></html>
