<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>JM Desk 菜单</title>
<link rel="stylesheet" href="./tokens.css">
<style>
/* 颜色来自 tokens.css（不引用 theme.css：这里的 .orb 是菜单泡泡本体，会和面板的小球冲突） */

.iris::before{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;padding:1.5px;opacity:.6;background:var(--iris);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor}
.morb{width:24px;height:24px;border-radius:50%;flex:none;position:relative;background:radial-gradient(circle at 50% 55%,rgba(255,255,255,.2) 45%,color-mix(in srgb,var(--a1) 45%,transparent) 100%),radial-gradient(circle at 46% 58%,var(--white),var(--pink-ll));box-shadow:0 3px 10px var(--glow),inset 0 0 8px color-mix(in srgb,var(--a1) 40%,transparent),inset 0 0 0 1px rgba(255,255,255,.9)}
.morb::after{content:'';position:absolute;inset:28%;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--a1) 80%,white) 0 30%,transparent 70%)}
html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden;font:12px -apple-system,"PingFang SC",sans-serif;user-select:none;-webkit-user-select:none}
#root{position:absolute;inset:0;transition:opacity .12s}
#box{position:absolute;inset:0}
.mb{position:absolute;width:var(--s);height:var(--s);margin:calc(var(--s) / -2) 0 0 calc(var(--s) / -2);--s:64px;cursor:pointer;
  opacity:0;transform:translate(var(--fx),var(--fy)) scale(.12);
  transition:transform .52s cubic-bezier(.18,1.32,.42,1),opacity .26s ease}
.mb.cat{--s:74px}.mb.cat.mini{--s:54px}.mb.mini .ic{width:20px;height:20px}.mb.mini .lb{font-size:10.5px}.mb.cat.on .orb{box-shadow:inset 0 0 0 1px rgba(255,255,255,.9),inset 0 0 16px color-mix(in srgb,var(--c1) 60%,transparent),0 0 0 2px color-mix(in srgb,var(--c1) 60%,transparent)}.mb.back{--s:46px}
.mb.in{opacity:1;transform:none}
.mb.out{opacity:0;transform:translate(var(--fx),var(--fy)) scale(.12);transition:transform .26s cubic-bezier(.55,0,.8,.2),opacity .22s ease}
/* 泡泡本体：和精灵的念力泡泡同一种质感——通透的珍珠白，边缘带粉紫荧光 */
.orb{position:absolute;inset:0;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  background:
    radial-gradient(circle at 50% 50%,rgba(255,255,255,0) 50%,color-mix(in srgb,var(--c1) 16%,transparent) 68%,color-mix(in srgb,var(--c1) 46%,transparent) 100%),
    radial-gradient(circle at 46% 58%,rgba(255,255,255,.92),rgba(255,255,255,.84) 62%,rgba(252,250,254,.78));
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.75),inset 0 0 14px color-mix(in srgb,var(--c1) 42%,transparent),
    0 6px 16px color-mix(in srgb,var(--c1) 26%,transparent),0 0 24px color-mix(in srgb,var(--c2) 20%,transparent);
  transition:transform .28s cubic-bezier(.2,1.6,.4,1),box-shadow .25s;animation:bob 3.4s ease-in-out infinite;animation-delay:var(--d)}
.orb::before{content:'';position:absolute;left:17%;top:9%;width:44%;height:27%;border-radius:50%;transform:rotate(-22deg);
  background:radial-gradient(ellipse at 50% 45%,rgba(255,255,255,.98),rgba(255,255,255,0) 72%)}
.orb::after{content:'';position:absolute;inset:0;border-radius:50%;opacity:.5;pointer-events:none;
  background:conic-gradient(from 0deg,var(--pink-l),var(--blue-l),#ffffff,var(--pink-l));
  -webkit-mask:radial-gradient(circle,transparent 64%,#000 76%,#000 100%);animation:spin 10s linear infinite}
.glint{position:absolute;right:16%;bottom:13%;width:18%;height:9%;border-radius:50%;background:rgba(255,255,255,.75);transform:rotate(-30deg);filter:blur(.4px)}
.ic{width:24px;height:24px;position:relative;z-index:1;filter:drop-shadow(0 0 3px color-mix(in srgb,var(--c1) 55%,transparent)) drop-shadow(0 1px 0 rgba(255,255,255,.9));transition:transform .25s}
.cat .ic{width:28px;height:28px}.back .ic{width:18px;height:18px}
.lb{position:relative;z-index:1;font-size:11px;font-weight:650;letter-spacing:.03em;color:var(--ink);text-shadow:0 1px 0 rgba(255,255,255,.85);white-space:nowrap}
.cat .lb{font-size:12px}
.mv{position:relative;z-index:1;font-size:19px;font-weight:750;letter-spacing:-.02em;line-height:1;color:var(--ink);text-shadow:0 1px 0 rgba(255,255,255,.85);font-variant-numeric:tabular-nums}.mb.mini .mv{font-size:14px}.mb:has(.mv) .lb{font-size:10px;font-weight:600;color:var(--sub)}
.back .lb{display:none}
/* 小星星 */
.tw{position:absolute;width:9px;height:9px;opacity:0;animation:tw 2.8s ease-in-out infinite;animation-delay:var(--td)}
.tw svg{width:100%;height:100%;display:block}
/* 落位时的一圈涟漪 */
.ring{position:absolute;inset:-4px;border-radius:50%;border:1.5px solid color-mix(in srgb,var(--c1) 70%,white);opacity:0}
.mb.in .ring{animation:ring .7s ease-out forwards;animation-delay:calc(var(--i) * 40ms + 260ms)}
/* 悬停 / 按下 */
.mb.in:hover .orb{transform:scale(1.1);animation-play-state:paused;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.9),inset 0 0 18px color-mix(in srgb,var(--c1) 58%,transparent),0 10px 24px color-mix(in srgb,var(--c1) 36%,transparent),0 0 30px color-mix(in srgb,var(--c2) 32%,transparent)}
.mb.in:hover .ic{transform:translateY(-1.5px)}
.mb.in:active .orb{transform:scale(.92);transition-duration:.08s}
/* 被选中：泡泡啵地一下破掉 */
.mb.picked{opacity:1;transform:none}
.mb.picked .orb{animation:pop .3s ease-out forwards}
.mb.picked .ring{animation:burst .42s ease-out forwards}
/* 开关 */
.mb.on .orb{box-shadow:inset 0 0 0 1px rgba(255,255,255,.85),inset 0 0 16px color-mix(in srgb,var(--c1) 55%,transparent),0 0 0 2px color-mix(in srgb,var(--c1) 55%,transparent),0 6px 16px color-mix(in srgb,var(--c1) 28%,transparent)}
.mb.off .orb{filter:saturate(.25) brightness(1.02)}.mb.off .lb{color:var(--faint)}
/* 数字 */
.n{position:absolute;top:-2px;right:-2px;z-index:2;min-width:18px;height:18px;padding:0 5px;box-sizing:border-box;border-radius:9px;
  background:var(--pink);color:var(--white);font-size:10.5px;font-weight:700;line-height:16px;text-align:center;border:1.5px solid var(--white);box-shadow:0 2px 6px var(--glow)}
/* 悬停说明：独立浮层，自动选择下/上/外/内侧，始终在屏幕内 */
#tip{position:absolute;left:0;top:0;opacity:0;pointer-events:none;white-space:pre;padding:5px 11px;border-radius:999px;
  background:var(--white);color:var(--ink);font-size:11.5px;
  box-shadow:0 4px 14px color-mix(in srgb,var(--black) 14%,transparent),0 0 0 1px var(--line);transition:opacity .16s,transform .2s;transform:translateY(2px);z-index:5}
#tip.show{opacity:1;transform:none}
/* 说话气泡：和菜单泡泡同一种珍珠质感，虹彩边，尾巴指向精灵 */
#say{position:absolute;left:0;top:0;width:276px;box-sizing:border-box;padding:11px 30px 11px 14px;border-radius:20px;cursor:pointer;color:var(--ink);
  background:var(--pearl);
  box-shadow:0 10px 26px color-mix(in srgb,var(--black) 16%,transparent),var(--rim);
  opacity:0;transform:translateY(6px) scale(.94);transform-origin:var(--tx,50%) 100%;transition:opacity .2s,transform .32s cubic-bezier(.2,1.35,.4,1);pointer-events:none;z-index:4}
#say.below{transform-origin:var(--tx,50%) 0%}
#say::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1.5px;opacity:.6;pointer-events:none;
  background:var(--iris);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor}
#say.show{opacity:1;transform:none;pointer-events:auto}
#say::after{content:'';position:absolute;left:calc(var(--tx,135px) - 7px);bottom:-7px;width:14px;height:14px;background:#fbfafd;transform:rotate(45deg);border-radius:3px;box-shadow:3px 3px 8px color-mix(in srgb,var(--black) 8%,transparent)}
#say.below::after{bottom:auto;top:-7px;background:var(--white);box-shadow:-2px -2px 6px color-mix(in srgb,var(--black) 5%,transparent)}
#say b{display:block;font-size:13px;font-weight:700;color:var(--pink-d)}
#say span{display:block;color:var(--sub);margin-top:3px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.5}
#say span.roll{animation:roll .35s ease-out}
#say i{position:absolute;right:9px;top:8px;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;color:var(--faint);font-style:normal;font-size:13px;cursor:pointer;background:rgba(255,255,255,.8);box-shadow:inset 0 0 0 1px var(--line)}
#say i:hover{color:var(--ink)}
/* 右键卡片：和面板同一种珍珠泡泡，从鼠标位置弹出 */
#ctx{position:absolute;left:0;top:0;width:212px;box-sizing:border-box;padding:7px;border-radius:20px;background:var(--pearl);color:var(--ink);z-index:6;
  box-shadow:0 14px 34px color-mix(in srgb,var(--black) 16%,transparent),var(--rim);
  opacity:0;transform:scale(.86);transform-origin:var(--ox,0) var(--oy,0);transition:opacity .16s,transform .28s cubic-bezier(.2,1.35,.4,1);pointer-events:none}
#ctx.show{opacity:1;transform:none;pointer-events:auto}
#ctx .hd{display:flex;align-items:center;gap:9px;padding:6px 8px 9px}
#ctx .hd b{display:block;font-size:13px;color:var(--ink);font-weight:700}
#ctx .hd small{display:block;font-size:10.5px;color:var(--sub);margin-top:1px}
#ctx .ci{display:flex;align-items:center;gap:10px;padding:7px 9px;border-radius:12px;cursor:pointer;font-size:12.5px;transition:background .15s,box-shadow .15s,transform .15s}
#ctx .ci .ic{width:18px;height:18px;flex:none;filter:none}
#ctx .ci span{flex:1}
#ctx .ci:hover{background:#fff;box-shadow:var(--rim),0 3px 10px var(--glow)}
#ctx .ci:active{transform:scale(.97)}
#ctx .ci.danger span{color:var(--bad-fg)}
#ctx .ci.armed{background:var(--bad-bg)}
#ctx .sep{height:1px;margin:5px 8px;background:linear-gradient(90deg,transparent,var(--line),transparent)}
#ctx .tg{width:28px;height:16px;border-radius:999px;flex:none;position:relative;background:color-mix(in srgb,var(--black) 14%,white);transition:background .2s}
#ctx .tg::after{content:'';position:absolute;left:2px;top:2px;width:12px;height:12px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.18);transition:transform .22s cubic-bezier(.2,1.4,.4,1)}
#ctx .tg.on{background:var(--pink)}#ctx .tg.on::after{transform:translateX(12px)}
@keyframes roll{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -3px}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes tw{0%,100%{opacity:0;transform:scale(.4)}45%{opacity:.95;transform:scale(1)}60%{opacity:.9}}
@keyframes ring{0%{opacity:.75;transform:scale(.85)}100%{opacity:0;transform:scale(1.35)}}
@keyframes burst{0%{opacity:.9;transform:scale(.9)}100%{opacity:0;transform:scale(1.7)}}
@keyframes pop{0%{transform:scale(1);opacity:1}45%{transform:scale(1.18);opacity:.9}100%{transform:scale(1.32);opacity:0}}
@media (prefers-reduced-motion: reduce){.mb,.mb.out{transition:opacity .15s;transform:none!important}.orb,.orb::after,.tw{animation:none}}
</style></head>
<body><div id="root"><div id="box"></div><div id="say"><i id="sx">×</i><b id="st"></b><span id="ss"></span></div><div id="tip"></div><div id="ctx" class="iris"></div></div><script src="./hud.js"></script></body></html>
